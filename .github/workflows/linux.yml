name: Linux CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Core install has no Excel or GUI packages
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('xlwings') is None; assert importlib.util.find_spec('ttkbootstrap') is None"

      - name: Run tests that do not need Excel or tkinter
        run: python -m pytest

  build:
    name: Build and twine check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Distributions contain no installer binaries
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          banned = {".xlam", ".xlsm", ".xlsx", ".xls", ".gif", ".exe", ".pkg"}
          artifacts = list(Path("dist").iterdir())
          if not artifacts:
              raise SystemExit("dist/ is empty")
          for path in artifacts:
              if path.suffix == ".whl":
                  names = zipfile.ZipFile(path).namelist()
              elif path.name.endswith(".tar.gz"):
                  names = tarfile.open(path).getnames()
              else:
                  continue
              bad = [name for name in names if Path(name).suffix.lower() in banned]
              if bad:
                  raise SystemExit(f"{path.name} contains {bad}")
              print(f"{path.name}: {len(names)} files, no installer binaries")
          PY
