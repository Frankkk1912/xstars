---
name: macOS support validation

"on":
  pull_request:
  push:
    branches:
      - feat/macos-support

permissions:
  contents: read

jobs:
  macos-tests:
    name: macOS / Python 3.10
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pin xlwings to the packaged workbook bridge version
        shell: bash
        run: python -m pip install "$(python installer/mac/build_pkg.py --print-xlwings-requirement)"
      - name: Run macOS support target tests
        run: >-
          python -m pytest tests/test_artifacts.py
          tests/test_macos_support.py -v
      - name: Run full regression suite
        run: python -m pytest
      - name: Compile Python sources and tests
        run: python -m compileall -q xstars tests

  windows-tests:
    name: Windows / Python 3.10
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pin xlwings to the packaged workbook bridge version
        shell: bash
        run: python -m pip install "$(python installer/mac/build_pkg.py --print-xlwings-requirement)"
      - name: Run macOS support target tests
        run: >-
          python -m pytest tests/test_artifacts.py
          tests/test_macos_support.py -v
      - name: Run full regression suite
        run: python -m pytest
      - name: Compile Python sources and tests
        run: python -m compileall -q xstars tests

  vba-immutability:
    name: Existing VBA files are unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Ribbon VBA is unchanged from main
        run: git diff --exit-code origin/main...HEAD -- 'ribbon/*.bas'

  macos-pkg-build:
    name: macOS / Build installer package
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pin xlwings to the packaged workbook bridge version
        shell: bash
        run: python -m pip install "$(python installer/mac/build_pkg.py --print-xlwings-requirement)"
      - name: Prepare bundled runtime
        run: python installer/mac/build_pkg.py --prepare-runtime
      - name: Smoke-test bundled runtime imports
        env:
          PYTHONSAFEPATH: "1"
        run: >-
          installer/mac/staging/python/bin/python3 -c
          "import xstars, xlwings, ttkbootstrap, matplotlib, PIL, pandas, numpy,
          scipy, scikit_posthocs, statannotations, seaborn; import sys;
          assert sys.prefix in xstars.__file__, xstars.__file__;
          print('OK', xstars.__version__)"
      - name: Check bundled runtime dependency consistency
        run: installer/mac/staging/python/bin/python3 -m pip check
      - name: Build unsigned macOS installer
        run: python installer/mac/build_pkg.py --build-pkg
      - name: Run macOS installer tests
        env:
          XSTARS_BUILT_PKG: "1"
        run: python -m pytest tests/test_macos_installer.py -q
      - name: Compile Python sources, tests, and installer tools
        run: python -m compileall -q -x staging xstars tests installer/mac
      - name: Upload macOS installer package
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-pkg
          path: installer/output/XSTARS-*.pkg
          retention-days: 7
